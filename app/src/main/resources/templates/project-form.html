<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">
<section>
    <h1 th:text="${pageTitle}">Project form</h1>
    <form class="panel form" th:action="${formAction}" th:object="${project}" method="post">
        <p class="error" th:if="${#fields.hasGlobalErrors()}"
           th:each="err : ${#fields.globalErrors()}" th:text="${err}">error</p>
        <label>
            Name
            <input type="text" th:field="*{name}" maxlength="120" required>
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </label>
        <label>
            Owner
            <input type="text" th:field="*{owner}" maxlength="120" required>
            <span class="error" th:if="${#fields.hasErrors('owner')}" th:errors="*{owner}"></span>
        </label>
        <label>
            Repository URL
            <input type="text" th:field="*{repositoryUrl}" maxlength="300" placeholder="https://github.com/org/repo">
            <span class="error" th:if="${#fields.hasErrors('repositoryUrl')}" th:errors="*{repositoryUrl}"></span>
        </label>
        <label>
            Description
            <textarea th:field="*{description}" maxlength="500" rows="4"></textarea>
            <span class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
        </label>
        <div class="actions">
            <button class="button primary" type="submit">Save project</button>
            <a class="button" href="/">Cancel</a>
        </div>
    </form>
</section>
</html>
