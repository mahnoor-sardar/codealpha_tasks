server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: devops-project-deployment-tracker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:tracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: DevOps Project Deployment Tracker
    description: Track software project deployments across environments

app:
  seed-data: ${APP_SEED_DATA:true}

logging:
  level:
    root: INFO
    com.devops.tracker: ${APP_LOG_LEVEL:INFO}
