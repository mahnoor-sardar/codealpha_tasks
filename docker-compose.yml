services:
  deployment-tracker:
    build: .
    image: devops-project-deployment-tracker:local
    container_name: deployment-tracker
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      APP_SEED_DATA: ${APP_SEED_DATA:-true}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      SPRING_DATASOURCE_URL: jdbc:h2:mem:tracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
